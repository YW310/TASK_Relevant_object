[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relevant-object-grounding"
version = "0.1.0"
description = "Task-relevant object grounding for robot manipulation episodes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py",
  "numpy",
  "Pillow",
  "torch",
  "matplotlib",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4.18"]

[project.scripts]
relevant-object = "relevant_object.cli.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
